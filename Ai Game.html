<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini 3 Hand-Controlled Particles</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #container { position: relative; width: 100vw; height: 100vh; }
        #ui {
            position: absolute; top: 20px; left: 20px; color: white;
            pointer-events: none; text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        video { transform: scaleX(-1); position: absolute; bottom: 20px; right: 20px; width: 200px; border-radius: 10px; border: 2px solid #444; }
        canvas { display: block; }
    </style>
</head>
<body>

<div id="ui">
    <h1>Hand-Particle System</h1>
    <p>1 Finger: Sphere | 2 Fingers: Heart | 3 Fingers: Saturn | 4 Fingers: Flower</p>
    <p id="status">Initializing Camera & AI...</p>
</div>
<video id="input_video"></video>

<!-- Load Three.js and MediaPipe -->
<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // --- Configuration ---
    const PARTICLE_COUNT = 15000;
    let currentShape = 'sphere';
    let targetPositions = new Float32Array(PARTICLE_COUNT * 3);
    let handExpansion = 1;
    let handPos = { x: 0, y: 0, z: 0 };

    // --- Setup Three.js ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // --- Particle System ---
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(PARTICLE_COUNT * 3);
    const colors = new Float32Array(PARTICLE_COUNT * 3);

    for (let i = 0; i < PARTICLE_COUNT; i++) {
        positions[i * 3] = (Math.random() - 0.5) * 10;
        positions[i * 3 + 1] = (Math.random() - 0.5) * 10;
        positions[i * 3 + 2] = (Math.random() - 0.5) * 10;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({
        size: 0.035,
        vertexColors: true,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
    });

    const points = new THREE.Points(geometry, material);
    scene.add(points);

    // --- Shape Generators ---
    function updateTargetShape(shapeName) {
        const pos = targetPositions;
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const i3 = i * 3;
            let x, y, z;

            if (shapeName === 'sphere') {
                const phi = Math.acos(-1 + (2 * i) / PARTICLE_COUNT);
                const theta = Math.sqrt(PARTICLE_COUNT * Math.PI) * phi;
                x = Math.cos(theta) * Math.sin(phi);
                y = Math.sin(theta) * Math.sin(phi);
                z = Math.cos(phi);
            } 
            else if (shapeName === 'heart') {
                const t = (i / PARTICLE_COUNT) * Math.PI * 2;
                // Randomized volume inside heart
                const r = Math.random();
                x = r * (16 * Math.pow(Math.sin(t), 3)) / 10;
                y = r * (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) / 10;
                z = (Math.random() - 0.5) * 0.5;
            } 
            else if (shapeName === 'saturn') {
                if (i < PARTICLE_COUNT * 0.4) { // The Planet
                    const phi = Math.random() * Math.PI * 2;
                    const theta = Math.random() * Math.PI;
                    x = Math.cos(phi) * Math.sin(theta) * 0.8;
                    y = Math.sin(phi) * Math.sin(theta) * 0.8;
                    z = Math.cos(theta) * 0.8;
                } else { // The Ring
                    const angle = Math.random() * Math.PI * 2;
                    const dist = 1.2 + Math.random() * 0.6;
                    x = Math.cos(angle) * dist;
                    y = Math.sin(angle) * dist * 0.2; // flattened ring
                    z = Math.sin(angle) * dist;
                }
            }
            else if (shapeName === 'flower') {
                const t = (i / PARTICLE_COUNT) * Math.PI * 2;
                const petal = 5;
                const r = Math.cos(petal * t) * 1.5;
                x = r * Math.cos(t);
                y = r * Math.sin(t);
                z = (Math.random() - 0.5) * 0.2;
            }

            pos[i3] = x;
            pos[i3+1] = y;
            pos[i3+2] = z;
        }
    }

    updateTargetShape('sphere');

    // --- MediaPipe Hands Setup ---
    // Note: Loading scripts dynamically for ease of use
    async function setupHands() {
        const scripts = [
            'https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js',
            'https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js'
        ];
        
        for (let s of scripts) {
            const script = document.createElement('script');
            script.src = s;
            script.async = false;
            document.head.appendChild(script);
        }

        const checkLoaded = setInterval(() => {
            if (window.Hands) {
                clearInterval(checkLoaded);
                initMediaPipe();
            }
        }, 100);
    }

    function initMediaPipe() {
        const videoElement = document.getElementById('input_video');
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults(onResults);

        const cameraPipe = new Camera(videoElement, {
            onFrame: async () => await hands.send({image: videoElement}),
            width: 640,
            height: 480
        });
        cameraPipe.start();
        document.getElementById('status').innerText = "AI Ready. Use Hand Gestures!";
    }

    function onResults(results) {
        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            const landmarks = results.multiHandLandmarks[0];
            
            // 1. Move System: Map middle finger MCP to screen
            handPos.x = (landmarks[9].x - 0.5) * -10;
            handPos.y = (landmarks[9].y - 0.5) * -10;

            // 2. Expansion: Distance between thumb tip(4) and index tip(8)
            const dx = landmarks[4].x - landmarks[8].x;
            const dy = landmarks[4].y - landmarks[8].y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            handExpansion = THREE.MathUtils.lerp(handExpansion, dist * 10, 0.1);

            // 3. Shape Switching: Count extended fingers
            let extendedFingers = 0;
            if (landmarks[8].y < landmarks[6].y) extendedFingers++; // Index
            if (landmarks[12].y < landmarks[10].y) extendedFingers++; // Middle
            if (landmarks[16].y < landmarks[14].y) extendedFingers++; // Ring
            if (landmarks[20].y < landmarks[18].y) extendedFingers++; // Pinky

            if (extendedFingers === 1 && currentShape !== 'sphere') { currentShape = 'sphere'; updateTargetShape('sphere'); }
            if (extendedFingers === 2 && currentShape !== 'heart') { currentShape = 'heart'; updateTargetShape('heart'); }
            if (extendedFingers === 3 && currentShape !== 'saturn') { currentShape = 'saturn'; updateTargetShape('saturn'); }
            if (extendedFingers >= 4 && currentShape !== 'flower') { currentShape = 'flower'; updateTargetShape('flower'); }
        }
    }

    // --- Animation Loop ---
    function animate() {
        requestAnimationFrame(animate);

        const positions = geometry.attributes.position.array;
        const colors = geometry.attributes.color.array;
        const time = Date.now() * 0.001;

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const i3 = i * 3;

            // Morph to target shape
            positions[i3] += (targetPositions[i3] * handExpansion - positions[i3]) * 0.05;
            positions[i3+1] += (targetPositions[i3+1] * handExpansion - positions[i3+1]) * 0.05;
            positions[i3+2] += (targetPositions[i3+2] * handExpansion - positions[i3+2]) * 0.05;

            // Color effects based on position/time
            colors[i3] = Math.sin(positions[i3] + time) * 0.5 + 0.5;
            colors[i3+1] = Math.cos(positions[i3+1] + time) * 0.5 + 0.5;
            colors[i3+2] = Math.sin(time) * 0.5 + 0.5;
        }

        // Apply slight float/drift based on handPos
        points.position.x += (handPos.x - points.position.x) * 0.1;
        points.position.y += (handPos.y - points.position.y) * 0.1;
        points.rotation.y += 0.002;

        geometry.attributes.position.needsUpdate = true;
        geometry.attributes.color.needsUpdate = true;

        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    setupHands();
    animate();

</script>
</body>
</html>
